<script type="module">
import * as THREE from 'three';

// ---------- utilita'

function B(x1, z1, x2, z2, y1, y2, mat, cast = true) {

// ---------- perimetro (stesse coordinate della piantina: x = X', z = Y')
const P = [[0,0],[0.49,0],[0.49,-0.70],[2.65,-0.70],[2.65,0],[3.99,0],[3.99,-0.70],[7.07,-0.70],[7.07,0],[7.73,0],
  [7.73,7.33],[6.22,7.33],[6.22,6.13],[2.53,6.13],[2.53,7.62],[0.80,7.57],[0.80,6.08],[0,6.08],[0,4.85],[0.52,4.85],[0.52,4.34],[0,4.34]];
const T = 0.30;
const nrm = (a, b) => { const dx = b[0]-a[0], dz = b[1]-a[1], L = Math.hypot(dx, dz); return [dz/L, -dx/L]; };

const wallTex = loader.load('wall.jpg'); wallTex.wrapS = wallTex.wrapT = THREE.MirroredRepeatWrapping; wallTex.colorSpace = THREE.SRGBColorSpace; wallTex.anisotropy = 8;

const GREENM = new THREE.MeshStandardMaterial({ color: 0xf6f3ec, bumpMap: greenTex, bumpScale: 0.9, roughness: 0.92 });

function quad(i, t0, t1, y0, y1, mat) {

  const A = P[i], Bp = P[(i+1)%P.length], A2 = O[i], B2 = O[(i+1)%P.length];

  g.rotateX(Math.PI / 2);
  { const pa = g.attributes.position, uv = new Float32Array(pa.count * 2); for (let k = 0; k < pa.count; k++) { uv[2*k] = (pa.getX(k) + pa.getZ(k)) * 0.42; uv[2*k+1] = (pa.getY(k) + y1) * 0.42; } g.setAttribute('uv', new THREE.BufferAttribute(uv, 2)); }

    const m0 = [(A[0]+A2[0])/2, (A[1]+A2[1])/2], m1 = [(Bp[0]+B2[0])/2, (Bp[1]+B2[1])/2];

    leaf.castShadow = !c.glassDoor; scene.add(leaf);

      const fr = new THREE.Mesh(new THREE.BoxGeometry(L - 0.06, 0.05, 0.05), DARK); fr.position.set((p0[0]+p1[0])/2, hh - 0.04, (p0[1]+p1[1])/2); fr.rotation.y = leaf.rotation.y; scene.add(fr);

// ---------- Billy 80x40x202 (frontale aperto con ripiani e oggetti)
const PAL = ['#d94f4f', '#3b7ddd', '#f2b134', '#4caf7a', '#8e6bd1', '#ece6d8', '#2e2e32', '#ff7a45', '#58c1c7', '#c7c7cc'];

  const g = new THREE.Group(); const Hh = 2.02, t = 0.02;
  const white = mc('#f4f2ee', 0.7);
  const add = (lx1, lz1, lx2, lz2, y1, y2, mat, cast = true) => {

    m.position.set((lx1 + lx2) / 2, (y1 + y2) / 2, (lz1 + lz2) / 2); m.castShadow = cast; m.receiveShadow = true; g.add(m);

  add(-w/2, -d/2, -w/2 + t, d/2, 0, Hh, white); add(w/2 - t, -d/2, w/2, d/2, 0, Hh, white);

    bx(cx, Hh + 0.43, z0, 0.26, 0.04, 0.12, col);                        // parte alta

function lowUnit(x1, z1, x2, z2) {
